tft:
  - name: "Test 1"
    namespace: "default"
    # "test_cases" can be specified individually i.e "1,2,3,6" or as a range
    # i.e. "1-9,15-19" or using the pretty names.
    test_cases: "1"
    duration: "30"
    # "logs": location of test results. Defaults to "<working-dir>/ft-logs/".
    # It is better to pass "--output-base" to ./tft.py.
    # "privileged_pod": whether to run test pods as privileged. Defaults to false.
    # "capabilities_pod": Linux capabilities for test pods. Format: {"add": ["CAP1", "CAP2"]}
    # capabilities_pod:
    #   add: ["NET_ADMIN", "SYS_TIME"]
    connections:
      - name: "Connection_1"
        # supported "type": iperf-tcp, iperf-udp, netperf-tcp-stream,
        # netperf-tcp-rr, http, simple, ib-write-bw, ib-read-bw, ib-send-bw.
        type: "iperf-tcp"
        instances: 1
        server:
          - name: "worker-229"
            persistent: "false"
            sriov: "true"
        client:
          - name: "worker-230"
            sriov: "true"
        plugins:
          - name: measure_cpu
          - name: measure_power
          - name: validate_offload
        # "secondary_network_nad" is always used for tests 27-29.
        # For these tests, it defaults to "tft-secondary". For other tests,
        # leaving "secondary_network_nad" unset means to use the primary
        # network.
        # "resource_name" is the extended resource for SR-IOV device plugin
        # (requests/limits). If unset, it is read from the NAD annotation
        # k8s.v1.cni.cncf.io/resourceName on the secondary NAD (if any), else
        # on the per-node "default_network" NAD used as Multus default network.
        # Set explicitly if autodetection cannot reach your NAD (e.g. offline render).
kubeconfig:
kubeconfig_infra:
